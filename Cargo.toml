[workspace]
members = ["benchmarks", "integration-tests", "remote-table", "remote-table/gen"]
resolver = "3"

[workspace.dependencies]
datafusion = "54"
datafusion-proto = "54"
arrow = { version = "58", features = ["chrono-tz"] }
datafusion-common = "54"
datafusion-execution = "54"
datafusion-expr = "54"
datafusion-physical-plan = "54"
datafusion-physical-expr = "54"
datafusion-catalog = "54"
datafusion-datasource = "54"
datafusion-sql = "54"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40" }
prost = "0.14"
prost-build = "0.14"
odbc-api = { version = "28.1.1", default-features = false, features = ["odbc_version_3_80"]}